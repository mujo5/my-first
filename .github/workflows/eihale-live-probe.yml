name: Format E-Ihale Afternoon Data

on:
  push:
    branches:
      - eihale-live-audit-20260820
    paths:
      - '.github/workflows/eihale-live-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eihale-live-audit-20260820
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build readable afternoon report
        run: |
          cat > /tmp/format.js <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const dir = 'live-output';
          const files = fs.readdirSync(dir)
            .filter((name) => /^details-\d+\.json$/.test(name))
            .sort();
          const rows = files.flatMap((name) => JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8')));

          function findValue(text, label) {
            const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const match = String(text || '').match(new RegExp(`${escaped}:\\s*([^\\n]+)`, 'i'));
            return match ? match[1].trim() : '';
          }

          function firstMatch(text, regex) {
            const match = String(text || '').match(regex);
            return match ? match[1].trim() : '';
          }

          function cleanDetails(body) {
            let value = String(body || '');
            const marker = value.indexOf('İHALE DETAYLARI');
            if (marker >= 0) value = value.slice(marker + 'İHALE DETAYLARI'.length);
            const stopMarkers = ['İHALE GÖRSELLERİ', 'İHALE FOTOĞRAFLARI', '© 2026', 'T.C. TİCARET BAKANLIĞI'];
            for (const stop of stopMarkers) {
              const index = value.indexOf(stop);
              if (index > 0) value = value.slice(0, index);
            }
            return value
              .replace(/\u00a0/g, ' ')
              .replace(/Açıklama ve Özel Şartlar/gi, '')
              .replace(/^\s*Açıklama \*\s*/i, '')
              .replace(/\n{3,}/g, '\n\n')
              .trim()
              .slice(0, 10000);
          }

          const parsed = rows.map((row) => {
            const body = row.bodyText || '';
            const endText = findValue(body, 'İhale Bitiş Tarihi');
            const time = firstMatch(endText, /(\d{2}:\d{2})/) || firstMatch(row.contextText, /20\/08\/2026\s+(\d{2}:\d{2})/);
            const title = String(row.title || '').replace(/^E-İhale\s*\|\s*/i, '').trim();
            return {
              index: row.index,
              time,
              title,
              url: row.href,
              auctionNo: findValue(body, 'İhale Numarası') || firstMatch(body, /İhale No:\s*([^\n]+)/i),
              operator: findValue(body, 'İşletme Müdürlüğü'),
              category: findValue(body, 'Eşya Kategori'),
              extraLiability: findValue(body, 'Ek Mali Yükümlülük'),
              liquidationReason: findValue(body, 'Tasfiye Nedeni'),
              location: findValue(body, 'Bulunduğu Yer'),
              appraisal: findValue(body, 'Satışa Esas Bedel'),
              deposit: findValue(body, 'Teminat Bedeli'),
              startingPrice: findValue(body, 'Başlangıç Bedeli'),
              currentPrice: firstMatch(body, /Güncel Fiyat:\s*([\d.]+\s*₺)/i),
              endText,
              details: cleanDetails(body)
            };
          }).sort((a, b) => a.time.localeCompare(b.time) || a.index - b.index);

          const lines = [];
          lines.push('# 20 Ağustos 2026 Öğleden Sonra E-İhale Canlı Detay Dökümü');
          lines.push('');
          lines.push(`Toplam doğrulanmış lot: **${parsed.length}**`);
          lines.push('');
          lines.push('> Bu dosya, 20 Ağustos 2026 sabahında eihale.gov.tr üzerindeki canlı liste ve her lotun detay sayfası taranarak oluşturulmuştur. Fiyatlar tarama anındaki değerlerdir; kapanışa kadar değişebilir.');
          lines.push('');

          for (const item of parsed) {
            lines.push(`## ${item.time || 'Saat bulunamadı'} — ${item.title}`);
            lines.push('');
            lines.push(`- **Detay:** ${item.url}`);
            lines.push(`- **İhale no:** ${item.auctionNo || '—'}`);
            lines.push(`- **İşletme:** ${item.operator || '—'}`);
            lines.push(`- **Kategori:** ${item.category || '—'}`);
            lines.push(`- **Yer:** ${item.location || '—'}`);
            lines.push(`- **Satışa esas bedel:** ${item.appraisal || '—'}`);
            lines.push(`- **Başlangıç bedeli:** ${item.startingPrice || '—'}`);
            lines.push(`- **Canlı fiyat:** ${item.currentPrice || 'Teklif yok / başlangıç bedeli geçerli'}`);
            lines.push(`- **Teminat:** ${item.deposit || '—'}`);
            lines.push(`- **Ek mali yük:** ${item.extraLiability || '—'}`);
            lines.push(`- **Tasfiye nedeni:** ${item.liquidationReason || '—'}`);
            lines.push(`- **Bitiş:** ${item.endText || '—'}`);
            lines.push('');
            lines.push('### Portalda görünen eşya ve özel şartlar');
            lines.push('');
            lines.push('```text');
            lines.push(item.details || 'Detay metni bulunamadı.');
            lines.push('```');
            lines.push('');
          }

          fs.writeFileSync(path.join(dir, 'afternoon-report.md'), lines.join('\n'));
          fs.writeFileSync(path.join(dir, 'afternoon-compact.json'), JSON.stringify(parsed, null, 2));
          console.log(`Formatted ${parsed.length} auctions.`);
          NODE
          node /tmp/format.js

      - name: Commit report
        run: |
          git config user.name "eihale-live-probe"
          git config user.email "actions@users.noreply.github.com"
          git add live-output/afternoon-report.md live-output/afternoon-compact.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Format live afternoon e-ihale report [skip ci]"
            git push origin HEAD:eihale-live-audit-20260820
          fi
