name: E-Ihale 24 August 2026 Live Audit

on:
  push:
    branches:
      - eihale-live-audit-20260824
    paths:
      - '.github/workflows/eihale-20260824.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eihale-live-audit-20260824
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install chromium

      - name: Scrape and normalize 24 August auctions
        run: node .github/scripts/eihale-audit-20260824.js

      - name: Commit live output
        if: always()
        run: |
          git config user.name "eihale-live-probe"
          git config user.email "actions@users.noreply.github.com"
          git add live-output-20260824
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Store refreshed 24 August 2026 e-ihale live audit [skip ci]"
            git pull --rebase origin eihale-live-audit-20260824
            git push origin HEAD:eihale-live-audit-20260824
          fi
