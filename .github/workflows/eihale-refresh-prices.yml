name: Refresh Current E-Ihale Prices

on:
  push:
    branches:
      - eihale-live-audit-20260820
    paths:
      - '.github/workflows/eihale-refresh-prices.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eihale-live-audit-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Refresh 42 detail pages
        run: |
          cat > /tmp/refresh.js <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const rows = JSON.parse(fs.readFileSync('live-output/actual-afternoon.json', 'utf8'));
          const money = (text, pattern) => {
            const m = String(text || '').match(pattern);
            return m ? m[1].replace(/\s+/g, ' ').trim() : '';
          };
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ locale: 'tr-TR', timezoneId: 'Europe/Istanbul' });
            const out = new Array(rows.length);
            let cursor = 0;
            async function worker() {
              while (true) {
                const i = cursor++;
                if (i >= rows.length) break;
                const item = rows[i];
                const page = await context.newPage();
                const result = { time: item.time, title: item.title, url: item.url, previous: item.currentPrice || item.startingPrice };
                try {
                  await page.goto(item.url, { waitUntil: 'domcontentloaded', timeout: 90000 });
                  await page.waitForTimeout(2500);
                  const body = await page.locator('body').innerText();
                  result.currentPrice = money(body, /Güncel Fiyat:\s*([\d.]+\s*₺)/i) || money(body, /Başlangıç Bedeli:\s*([\d.]+\s*₺)/i);
                  result.endText = money(body, /İhale Bitiş Tarihi:\s*([^\n]+)/i);
                } catch (e) {
                  result.error = String(e);
                }
                out[i] = result;
                await page.close();
              }
            }
            await Promise.all(Array.from({ length: 8 }, worker));
            fs.writeFileSync('live-output/current-prices.json', JSON.stringify({ refreshedAt: new Date().toISOString(), rows: out }, null, 2));
            await browser.close();
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
          node /tmp/refresh.js
      - name: Commit refreshed prices
        run: |
          git config user.name "eihale-live-probe"
          git config user.email "actions@users.noreply.github.com"
          git add live-output/current-prices.json
          git commit -m "Refresh live afternoon auction prices [skip ci]"
          git push origin HEAD:eihale-live-audit-20260820
